name: WalkingBaseline
options:
  bundleIdPrefix: edu.ucla.m202a
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  WalkingBaseline:
    type: application
    platform: iOS
    sources:
      - Sources
      - Native
      - path: Resources
        excludes: [Room, "*.wifiroom"]
        buildPhase: resources
      - path: Resources/Room
        type: folder
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Room Wi-Fi
        NSCameraUsageDescription: Track your position and align a virtual marker with the room.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arkit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.ucla.m202a.WalkingBaseline
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_OBJC_BRIDGING_HEADER: Native/Bridge.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Vendor"
        OTHER_LDFLAGS[sdk=iphoneos*]: "$(inherited) -framework opencv2 -framework Accelerate -framework AVFoundation -framework CoreMedia -framework CoreVideo -framework QuartzCore -framework CoreGraphics -framework UIKit -framework Foundation -lc++ -lz"
  WalkingBaselineTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: WalkingBaseline
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WalkingBaseline:
    build:
      targets:
        WalkingBaseline: all
    test:
      targets: [WalkingBaselineTests]
