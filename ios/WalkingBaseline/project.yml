name: WalkingBaseline
options:
  bundleIdPrefix: edu.ucla.m202a
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  WalkingBaseline:
    type: application
    platform: iOS
    sources: [Sources]
    resources: [Resources]
    info:
      path: Generated/Info.plist
      properties:
        NSCameraUsageDescription: Track your position and align a virtual marker with the room.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arkit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.ucla.m202a.WalkingBaseline
        TARGETED_DEVICE_FAMILY: '1'
  WalkingBaselineTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: WalkingBaseline
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WalkingBaseline:
    build:
      targets:
        WalkingBaseline: all
    test:
      targets: [WalkingBaselineTests]
